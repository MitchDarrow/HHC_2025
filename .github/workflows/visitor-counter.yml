name: Visitor Counter

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour
  workflow_dispatch:      # allows manual runs

jobs:
  count_visits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch GitHub traffic data
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mitchdarrow/HHC_2025/traffic/popular/paths \
            > paths.json

      - name: Extract 1.gif count safely
        id: extract
        run: |
          # Find any path that ends with 1.gif
          COUNT=$(jq '[.[] | select(.path | endswith("1.gif"))][0].count // 0' paths.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update visitor_count.json
        run: |
          jq --argjson c "${{ steps.extract.outputs.count }}" \
             --arg t "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
             '.count = $c | .last_updated = $t' \
             visitor_count.json > visitor_count_new.json
          mv visitor_count_new.json visitor_count.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add visitor_count.json
          git commit -m "Update visitor count" || echo "No changes to commit"
          git push
