name: Visitor Counter

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  count_visits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Debug: list files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -R .

      - name: Fetch GitHub traffic data (authenticated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mitchdarrow/HHC_2025/traffic/popular/paths \
            > paths.json

      - name: Extract 1.gif count safely
        id: extract
        run: |
          COUNT=$(jq -r '
            if type=="array" then
              (map(select(.path | endswith("1.gif"))) | .[0].count) // 0
            else
              0
            end
          ' paths.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Ensure visitor_count.json exists
        run: |
          if [ ! -f visitor_count.json ]; then
            echo '{"count":0,"last_updated":""}' > visitor_count.json
          fi

      - name: Update visitor_count.json
        run: |
          jq --argjson c "${{ steps.extract.outputs.count }}" \
             --arg t "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
             '.count = $c | .last_updated = $t' \
             visitor_count.json > visitor_count_new.json
          mv visitor_count_new.json visitor_count.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add visitor_count.json
          git commit -m "Update visitor count" || echo "No changes to commit"
          git push
